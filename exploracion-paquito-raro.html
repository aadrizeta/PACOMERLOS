<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exploración — Paquito Raro · Paco Merlos</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="style.css" />

    <style>
      /* Reset de contexto: el design_canvas carga el site CSS entero pero
     queremos que los artboards se comporten como slices independientes.
     Cada artboard tiene overflow:hidden y width/height fijas. */
      body {
        margin: 0;
        font-family: "Now", system-ui, sans-serif;
      }

      .ab {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: relative;
      }
      .ab-scroll {
        width: 100%;
        height: 100%;
        overflow: auto;
        position: relative;
      }

      /* ───────────── V1 · Tarjeta con sello oculto ───────────── */
      .v1 {
        background: #0f0f0f;
        color: #fffff1;
        padding: 2.25rem 2rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        height: 100%;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }
      .v1::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 20% 0%,
            rgba(140, 82, 255, 0.35),
            transparent 55%
          ),
          radial-gradient(
            ellipse at 80% 100%,
            rgba(255, 101, 58, 0.22),
            transparent 60%
          );
        pointer-events: none;
      }
      .v1 > * {
        position: relative;
        z-index: 1;
      }
      .v1-eyebrow {
        font-size: 0.68rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #ffd200;
        font-weight: 800;
      }
      .v1-h {
        font-family: "Chunko", sans-serif;
        font-size: 3.25rem;
        line-height: 0.9;
        letter-spacing: 0.01em;
        text-transform: uppercase;
        margin: 0;
      }
      .v1-h em {
        font-style: normal;
        color: #ff653a;
        display: block;
      }
      .v1-card {
        margin-top: auto;
        background: rgba(255, 255, 241, 0.05);
        border: 1px dashed rgba(255, 210, 0, 0.35);
        border-radius: 12px;
        padding: 1.1rem 1.25rem;
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      .v1-sello {
        flex-shrink: 0;
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 50%;
        background: #ffd200;
        color: #0f0f0f;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Chunko", sans-serif;
        font-size: 1.75rem;
        transform: rotate(-8deg);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
      }
      .v1-card strong {
        font-family: "Chunko", sans-serif;
        font-size: 0.95rem;
        letter-spacing: 0.14em;
        color: #ffd200;
        display: block;
        margin-bottom: 0.2rem;
      }
      .v1-card p {
        margin: 0;
        font-size: 0.82rem;
        color: rgba(255, 255, 241, 0.65);
        line-height: 1.5;
      }
      .v1-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.4rem;
        margin-top: 0.5rem;
      }
      .v1-slot {
        aspect-ratio: 1;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 241, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.55rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255, 255, 241, 0.35);
        background: rgba(255, 255, 241, 0.03);
      }
      .v1-slot.x {
        background: rgba(255, 210, 0, 0.08);
        border-color: rgba(255, 210, 0, 0.4);
        color: #ffd200;
        font-size: 1.25rem;
        font-family: "Chunko", sans-serif;
        position: relative;
      }
      .v1-slot.x::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: inherit;
        border: 1px solid rgba(255, 210, 0, 0.25);
        animation: v1pulse 2s infinite;
      }
      @keyframes v1pulse {
        50% {
          opacity: 0.3;
          transform: scale(1.08);
        }
      }

      /* ───────────── V2 · Recibo / ticket vertical ───────────── */
      .v2 {
        background: #8c52ff;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }
      .v2::before {
        content: "? ? ? ?";
        position: absolute;
        font-family: "Chunko", sans-serif;
        font-size: 14rem;
        color: rgba(255, 255, 241, 0.05);
        top: -3rem;
        left: -2rem;
        line-height: 0.8;
        letter-spacing: -0.02em;
        pointer-events: none;
        white-space: pre-wrap;
        width: 120%;
      }
      .v2-ticket {
        background: #fffff1;
        color: #0f0f0f;
        width: 100%;
        max-width: 22rem;
        padding: 1.5rem 1.5rem 1rem;
        position: relative;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        font-family: "Now", sans-serif;
      }
      .v2-ticket::before,
      .v2-ticket::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 0.75rem;
        background: radial-gradient(
            circle 0.375rem at 0.375rem 0.375rem,
            #8c52ff 98%,
            transparent 100%
          )
          0 0/0.75rem 0.75rem repeat-x;
      }
      .v2-ticket::before {
        top: -0.75rem;
      }
      .v2-ticket::after {
        bottom: -0.75rem;
        transform: scaleY(-1);
      }
      .v2-t-head {
        text-align: center;
        border-bottom: 1px dashed rgba(15, 15, 15, 0.2);
        padding-bottom: 0.75rem;
        margin-bottom: 0.9rem;
      }
      .v2-t-head small {
        font-size: 0.6rem;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(15, 15, 15, 0.5);
        font-weight: 700;
      }
      .v2-t-head strong {
        font-family: "Chunko", sans-serif;
        font-size: 1.8rem;
        display: block;
        margin-top: 0.2rem;
        color: #8c52ff;
      }
      .v2-t-row {
        display: flex;
        justify-content: space-between;
        font-family: "Now", monospace;
        font-size: 0.78rem;
        padding: 0.35rem 0;
        border-bottom: 1px dotted rgba(15, 15, 15, 0.1);
      }
      .v2-t-row b {
        font-weight: 700;
      }
      .v2-t-row span {
        color: rgba(15, 15, 15, 0.5);
      }
      .v2-t-total {
        display: flex;
        justify-content: space-between;
        margin-top: 0.6rem;
        padding-top: 0.6rem;
        border-top: 2px solid #0f0f0f;
        font-family: "Chunko", sans-serif;
        letter-spacing: 0.05em;
      }
      .v2-t-total b {
        font-size: 0.85rem;
      }
      .v2-t-total em {
        font-style: normal;
        font-size: 1.1rem;
        color: #ff653a;
      }
      .v2-t-bar {
        margin-top: 0.8rem;
        height: 2.5rem;
        background: repeating-linear-gradient(
          90deg,
          #0f0f0f 0 2px,
          transparent 2px 4px,
          #0f0f0f 4px 5px,
          transparent 5px 9px
        );
      }
      .v2-t-foot {
        text-align: center;
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(15, 15, 15, 0.5);
        margin-top: 0.6rem;
        font-weight: 700;
      }

      /* ───────────── V3 · Alerta radar / transmisión ───────────── */
      .v3 {
        background: #0a0a0a;
        color: #fffff1;
        height: 100%;
        padding: 1.75rem;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        position: relative;
        overflow: hidden;
        font-family: "Now", monospace;
      }
      .v3-scan {
        position: absolute;
        inset: 0;
        background:
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.025) 0 2px,
            transparent 2px 4px
          ),
          radial-gradient(
            ellipse at 50% 50%,
            rgba(140, 82, 255, 0.15),
            transparent 70%
          );
        pointer-events: none;
      }
      .v3 > * {
        position: relative;
        z-index: 1;
      }
      .v3-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.62rem;
        letter-spacing: 0.18em;
        color: #ffd200;
        text-transform: uppercase;
      }
      .v3-top .dot {
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        border-radius: 50%;
        background: #ff3030;
        margin-right: 0.35rem;
        animation: v3blink 1s infinite;
      }
      @keyframes v3blink {
        50% {
          opacity: 0.3;
        }
      }
      .v3-h {
        font-family: "Chunko", sans-serif;
        font-size: 2.8rem;
        line-height: 0.9;
        text-transform: uppercase;
        margin: 0.5rem 0 0;
      }
      .v3-h em {
        font-style: normal;
        color: #ffd200;
        display: block;
        text-shadow: 0 0 12px rgba(255, 210, 0, 0.5);
      }
      .v3-log {
        background: rgba(255, 255, 241, 0.04);
        border-left: 2px solid #ffd200;
        padding: 0.75rem 1rem;
        font-size: 0.72rem;
        line-height: 1.7;
        color: rgba(255, 255, 241, 0.65);
      }
      .v3-log .t {
        color: #8c52ff;
      }
      .v3-log .k {
        color: #ff653a;
        font-weight: 700;
      }
      .v3-grid {
        display: flex;
        gap: 0.5rem;
        margin-top: auto;
      }
      .v3-cell {
        flex: 1;
        aspect-ratio: 1;
        border: 1px solid rgba(255, 255, 241, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.25rem;
      }
      .v3-cell.hit {
        background: rgba(255, 210, 0, 0.08);
        border-color: #ffd200;
        color: #ffd200;
        font-family: "Chunko", sans-serif;
        font-size: 1.8rem;
      }
      .v3-cell .lbl {
        font-size: 0.5rem;
        letter-spacing: 0.15em;
        color: rgba(255, 255, 241, 0.4);
        text-transform: uppercase;
      }
      .v3-cell .val {
        font-size: 0.7rem;
        color: rgba(255, 255, 241, 0.6);
        font-weight: 700;
      }
      .v3-cta {
        font-family: "Chunko", sans-serif;
        font-size: 0.8rem;
        letter-spacing: 0.14em;
        color: #0f0f0f;
        background: #ffd200;
        padding: 0.75rem 1rem;
        text-align: center;
        text-transform: uppercase;
      }

      /* ───────────── V4 · Sobre lacrado / secreto ───────────── */
      .v4 {
        background: #ffffe3;
        height: 100%;
        padding: 2rem;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        position: relative;
        overflow: hidden;
      }
      .v4-eyebrow {
        font-family: "Now", monospace;
        font-size: 0.65rem;
        letter-spacing: 0.28em;
        color: rgba(15, 15, 15, 0.5);
        text-transform: uppercase;
        font-weight: 700;
      }
      .v4-env {
        width: 100%;
        max-width: 20rem;
        aspect-ratio: 5/3;
        position: relative;
        background: linear-gradient(135deg, #f5f0e0 0%, #e8dfc6 100%);
        border: 1px solid rgba(15, 15, 15, 0.15);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .v4-env::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          transparent 45%,
          rgba(15, 15, 15, 0.04) 50%,
          transparent 55%
        );
      }
      .v4-env::after {
        content: "";
        position: absolute;
        top: 0;
        left: 10%;
        right: 10%;
        height: 52%;
        background: linear-gradient(135deg, #ebe2cc 0%, #ded4bb 100%);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
        border-bottom: 1px dashed rgba(15, 15, 15, 0.2);
      }
      .v4-sello {
        position: absolute;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ff8a5c, #c9451e);
        color: #fffff1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Chunko", sans-serif;
        font-size: 1.5rem;
        z-index: 2;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        transform: rotate(-6deg);
        top: 50%;
        left: 50%;
        margin: -2.25rem 0 0 -2.25rem;
      }
      .v4-sello::before {
        content: "";
        position: absolute;
        inset: 0.25rem;
        border-radius: 50%;
        border: 1px dashed rgba(255, 255, 241, 0.5);
      }
      .v4-h {
        font-family: "Chunko", sans-serif;
        font-size: 2.2rem;
        line-height: 0.95;
        text-transform: uppercase;
        text-align: center;
        margin: 0;
        color: #0f0f0f;
      }
      .v4-h em {
        font-style: normal;
        color: #8c52ff;
        display: block;
      }
      .v4-p {
        font-size: 0.9rem;
        line-height: 1.6;
        color: rgba(15, 15, 15, 0.6);
        text-align: center;
        max-width: 22rem;
        margin: 0;
      }
      .v4-p b {
        color: #0f0f0f;
        font-weight: 800;
      }
      .v4-cta {
        font-family: "Chunko", sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #fffff1;
        background: #0f0f0f;
        padding: 0.75rem 1.25rem;
      }

      /* ──────────────────────────────────────────────────────── */
      /* Galería · variantes                                       */
      /* ──────────────────────────────────────────────────────── */

      /* ─────── G1 · Collage con polaroid mix ─────── */
      .g1 {
        background: #ffffe3;
        height: 100%;
        padding: 2rem 1.5rem;
        box-sizing: border-box;
        position: relative;
        overflow: hidden;
      }
      .g1-h {
        font-family: "Chunko", sans-serif;
        font-size: 2rem;
        text-align: center;
        margin: 0 0 0.3rem;
        line-height: 0.95;
        text-transform: uppercase;
      }
      .g1-h em {
        font-style: normal;
        color: #ff653a;
      }
      .g1-sub {
        text-align: center;
        font-size: 0.78rem;
        color: rgba(15, 15, 15, 0.55);
        margin: 0 0 1.25rem;
      }
      .g1-stage {
        position: relative;
        height: calc(100% - 5rem);
      }
      .g1-pol {
        position: absolute;
        background: #fffff1;
        padding: 0.5rem 0.5rem 1.5rem;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.15);
        font-family: "Comic Sans MS", cursive;
        font-size: 0.7rem;
        color: #0f0f0f;
        text-align: center;
      }
      .g1-pol .img {
        width: 100%;
        aspect-ratio: 1;
        background: var(--c, #8c52ff)
          repeating-linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.12) 0 10px,
            transparent 10px 20px
          );
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fffff1;
        font-family: "Chunko", sans-serif;
        font-size: 0.9rem;
      }
      .g1-pol .cap {
        margin-top: 0.35rem;
      }
      .g1-pol.p1 {
        width: 38%;
        top: 0;
        left: 5%;
        transform: rotate(-5deg);
        --c: #ff653a;
      }
      .g1-pol.p2 {
        width: 42%;
        top: 8%;
        right: 3%;
        transform: rotate(4deg);
        --c: #8c52ff;
      }
      .g1-pol.p3 {
        width: 36%;
        top: 46%;
        left: 8%;
        transform: rotate(3deg);
        --c: #ffd200;
        color: #0f0f0f;
      }
      .g1-pol.p4 {
        width: 38%;
        top: 52%;
        right: 6%;
        transform: rotate(-4deg);
        --c: #ff653a;
      }
      .g1-pol.p3 .img {
        color: #0f0f0f;
      }
      .g1-star {
        position: absolute;
        font-family: "Chunko", sans-serif;
        font-size: 0.55rem;
        letter-spacing: 0.15em;
        color: #fffff1;
        background: #ff653a;
        padding: 0.15rem 0.4rem;
        border-radius: 0.25rem;
        top: 0.5rem;
        right: 0.5rem;
        transform: rotate(6deg);
      }

      /* ─────── G2 · Feed IG stylized ─────── */
      .g2 {
        background: #ffffe3;
        height: 100%;
        padding: 1.5rem 1.25rem;
        box-sizing: border-box;
        overflow: hidden;
      }
      .g2-phone {
        width: 100%;
        max-width: 18rem;
        margin: 0 auto;
        background: #0f0f0f;
        border-radius: 1.5rem;
        padding: 0.4rem;
        height: calc(100% - 1rem);
        display: flex;
        flex-direction: column;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      }
      .g2-screen {
        background: #fffff1;
        flex: 1;
        border-radius: 1.15rem;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .g2-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.55rem 0.85rem;
        border-bottom: 1px solid rgba(15, 15, 15, 0.08);
        font-family: "Chunko", sans-serif;
        font-size: 0.85rem;
        color: #0f0f0f;
      }
      .g2-bar span {
        font-size: 0.65rem;
        color: rgba(15, 15, 15, 0.5);
        font-family: "Now", sans-serif;
      }
      .g2-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        padding: 2px;
      }
      .g2-tile {
        aspect-ratio: 1;
        background: var(--c, #8c52ff);
        position: relative;
        display: flex;
        align-items: flex-end;
        padding: 0.3rem;
        font-size: 0.5rem;
        color: #fffff1;
        font-weight: 700;
        letter-spacing: 0.1em;
      }
      .g2-tile.win::before {
        content: "★";
        position: absolute;
        top: 0.25rem;
        left: 0.25rem;
        background: #ffd200;
        color: #0f0f0f;
        width: 0.95rem;
        height: 0.95rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        font-size: 0.55rem;
      }
      .g2-tile.img {
        background-image: repeating-linear-gradient(
          45deg,
          rgba(255, 255, 255, 0.12) 0 6px,
          transparent 6px 12px
        );
      }
      .g2-foot {
        padding: 0.7rem;
        text-align: center;
        background: #ff653a;
        color: #fffff1;
        font-family: "Chunko", sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      /* ─────── G3 · Revista editorial ─────── */
      .g3 {
        background: #fffff1;
        height: 100%;
        padding: 2rem 1.75rem;
        box-sizing: border-box;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
      }
      .g3-top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        border-bottom: 1px solid #0f0f0f;
        padding-bottom: 0.5rem;
      }
      .g3-top .num {
        font-family: "Chunko", sans-serif;
        font-size: 2.5rem;
        line-height: 1;
        color: #ff653a;
      }
      .g3-top .meta {
        font-family: "Now", monospace;
        font-size: 0.6rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-align: right;
        color: rgba(15, 15, 15, 0.6);
      }
      .g3-h {
        font-family: "Chunko", sans-serif;
        font-size: 1.65rem;
        line-height: 0.98;
        text-transform: uppercase;
        margin: 0;
      }
      .g3-h em {
        font-style: normal;
        color: #8c52ff;
      }
      .g3-layout {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
        gap: 0.5rem;
        flex: 1;
      }
      .g3-hero {
        background: #8c52ff;
        position: relative;
        display: flex;
        align-items: flex-end;
        padding: 0.75rem;
        color: #fffff1;
        font-family: "Chunko", sans-serif;
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .g3-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08) 0 8px,
          transparent 8px 16px
        );
      }
      .g3-hero .badge {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        background: #ffd200;
        color: #0f0f0f;
        font-family: "Now", sans-serif;
        font-size: 0.55rem;
        font-weight: 800;
